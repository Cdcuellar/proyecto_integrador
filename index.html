<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoreo de agua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#e9f0f2; --panel:#ffffff; --tinta:#10303a; --suave:#5d7882;
  --linea:#cfdde2; --agua:#0e8a9b; --agua-osc:#0a5f6c; --off:#9fb3ba;
}
@media (prefers-color-scheme: dark){
  :root{ --fondo:#0b1b20; --panel:#12272e; --tinta:#e4f1f4; --suave:#8fa9b2;
         --linea:#24424b; --agua:#37c0d3; --agua-osc:#7fdbe8; --off:#4b6670; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--tinta);font-family:'Manrope','Segoe UI',system-ui,sans-serif;line-height:1.5}
.cont{max-width:1100px;margin:0 auto;padding:24px 20px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:1.6rem;font-weight:800;margin:0;letter-spacing:-.01em}
.estado{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--suave)}
.punto{width:10px;height:10px;border-radius:50%;background:var(--off)}
.punto.ok{background:#25a86b}
.punto.error{background:#d6483d}
nav{display:flex;gap:4px;border-bottom:2px solid var(--linea);margin-bottom:24px}
nav button{font:inherit;font-weight:700;background:none;border:0;color:var(--suave);padding:10px 18px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button[aria-selected="true"]{color:var(--agua-osc);border-bottom-color:var(--agua)}
nav button:focus-visible{outline:2px solid var(--agua);outline-offset:2px}
.vista[hidden]{display:none}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.tarjeta{background:var(--panel);border:1px solid var(--linea);border-left:6px solid var(--agua);border-radius:8px;padding:18px 20px}
.tarjeta h2{font-size:.95rem;font-weight:500;color:var(--suave);margin:0 0 10px}
.valor{font-size:2.4rem;font-weight:800;line-height:1.1}
.valor small{font-size:1rem;font-weight:500;color:var(--suave);margin-left:6px}
.vacio{color:var(--off)}
.insignia{display:inline-flex;align-items:center;gap:8px;font-size:1.3rem;font-weight:800}
.insignia .punto{width:12px;height:12px}
.insignia.on .punto{background:var(--agua)}
.mitades{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.mitades{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--linea);border-radius:8px;padding:20px;min-height:260px}
.panel h2{font-size:1.2rem;font-weight:800;margin:0 0 12px}
.panel p{color:var(--suave);margin:0}
footer{margin-top:24px;font-size:.85rem;color:var(--suave)}
</style>
</head>
<body>
<div class="cont">
  <header>
    <h1>Monitoreo de agua</h1>
    <div class="estado"><span class="punto" id="punto"></span><span id="conexion">Conectando…</span></div>
  </header>

  <nav role="tablist">
    <button role="tab" id="t1" aria-selected="true" aria-controls="v1">Sensores</button>
    <button role="tab" id="t2" aria-selected="false" aria-controls="v2">Historial y umbrales</button>
  </nav>

  <section class="vista" id="v1" role="tabpanel" aria-labelledby="t1">
    <div class="rejilla" id="rejilla"></div>
    <footer>Última actualización: <span id="actualizado">sin datos</span></footer>
  </section>

  <section class="vista" id="v2" role="tabpanel" aria-labelledby="t2" hidden>
    <div class="mitades">
      <div class="panel">
        <h2>Historial de mediciones</h2>
        <p>Las mediciones guardadas aparecerán aquí.</p>
      </div>
      <div class="panel">
        <h2>Configuración de umbrales</h2>
        <p>Los umbrales de cada sensor se definirán aquí.</p>
      </div>
    </div>
  </section>
</div>

<script>
// Para agregar un sensor: añade una línea. "campo" es el nombre que llega en el JSON.
const SENSORES = [
  { nombre: "Sensor de temperatura",              campo: "temperatura", unidad: "°C" },
  { nombre: "Sensor de turbidez",                 campo: "turbidez",    unidad: "NTU" },
  { nombre: "Sensor de caudal",                   campo: "caudal",      unidad: "L/min" },
  { nombre: "Estado del transductor ultrasónico", campo: "transductor", tipo: "estado" },
  { nombre: "Estado de la lámpara UV",            campo: "lampara_uv",  tipo: "estado" }
];

const rejilla = document.getElementById("rejilla");
SENSORES.forEach((s, i) => {
  const div = document.createElement("div");
  div.className = "tarjeta";
  div.innerHTML = `<h2>${s.nombre}</h2><div id="s${i}"></div>`;
  rejilla.appendChild(div);
  pintar(i, s, undefined);
});

function pintar(i, s, v) {
  const el = document.getElementById("s" + i);
  if (s.tipo === "estado") {
    if (v === undefined) { el.innerHTML = '<span class="valor vacio">--</span>'; return; }
    const on = v === true || v === 1 || v === "1" || String(v).toLowerCase() === "on";
    el.innerHTML = `<span class="insignia ${on ? "on" : ""}"><span class="punto"></span>${on ? "Encendido" : "Apagado"}</span>`;
  } else if (v === undefined) {
    el.innerHTML = `<span class="valor vacio">--<small>${s.unidad}</small></span>`;
  } else {
    const n = Number(v);
    el.innerHTML = `<span class="valor">${Number.isInteger(n) ? n : n.toFixed(1)}<small>${s.unidad}</small></span>`;
  }
}

async function actualizar() {
  const punto = document.getElementById("punto");
  try {
    const r = await fetch("/api/datos?limite=50", { headers: { "ngrok-skip-browser-warning": "true" } });
    const datos = await r.json();            // el más reciente primero
    SENSORES.forEach((s, i) => {
      const reg = datos.find(d => d[s.campo] !== undefined);
      pintar(i, s, reg ? reg[s.campo] : undefined);
    });
    if (datos.length) {
      document.getElementById("actualizado").textContent = new Date(datos[0].recibido).toLocaleTimeString();
    }
    punto.className = "punto ok";
    document.getElementById("conexion").textContent = "Servidor conectado";
  } catch (e) {
    punto.className = "punto error";
    document.getElementById("conexion").textContent = "Sin conexión con el servidor";
  }
}
actualizar();
setInterval(actualizar, 3000);

// Pestañas
const tabs = [["t1", "v1"], ["t2", "v2"]];
tabs.forEach(([t, v]) => {
  document.getElementById(t).addEventListener("click", () => {
    tabs.forEach(([t2, v2]) => {
      document.getElementById(t2).setAttribute("aria-selected", t2 === t);
      document.getElementById(v2).hidden = (v2 !== v);
    });
  });
});
</script>
</body>
</html>
